# XcodeGen spec — the GitHub Actions build turns this into BuzzLab.xcodeproj.
# Target device: iPhone 17 Pro. Deployment target 26.0 so it runs on iOS 26 and 27.
name: BuzzLab
options:
  bundleIdPrefix: com.mrlttec
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BuzzLab:
    type: application
    platform: iOS
    sources:
      - Sources
    scheme: {}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Buzz Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrlttec.buzzlab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
