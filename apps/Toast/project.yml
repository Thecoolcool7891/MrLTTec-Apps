# XcodeGen spec for Toast: Landon's school assistant (the Toast Bot server on the mini PC), over Tailscale.
# Target device: iPhone 17 Pro. Deployment target 26.0 so it runs on iOS 26 and 27.
name: Toast
options:
  bundleIdPrefix: com.mrlttec
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Toast:
    type: application
    platform: iOS
    sources:
      - Sources
    scheme: {}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Toast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Light
        NSCameraUsageDescription: Take a photo of homework or notes to send to Toast.
        # Checks for new Toast alerts now and then while the app is closed (best effort).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mrlttec.toast.refresh]
        # Plain http to the Tailscale address (100.x). Only NSAllowsArbitraryLoads: when NSAllowsLocalNetworking is
        # also set, iOS ignores NSAllowsArbitraryLoads, and 100.x isn't "local", so http to it gets blocked.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrlttec.toast
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
