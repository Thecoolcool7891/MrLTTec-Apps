# XcodeGen spec for MrLTTec Smart Home (iPhone 17 Pro, runs on iOS 26 and 27).
name: SmartHome
options:
  bundleIdPrefix: com.mrlttec
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SmartHome:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../shared
    scheme: {}
    dependencies:
      - target: ScreenBroadcast
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MrLTTec Home
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        NSBonjourServices: [_companion-link._tcp]
        # MrLTTec Control's Settings has an Open button for this app (mrlttechome://).
        CFBundleURLTypes:
          - CFBundleURLName: com.mrlttec.smarthome
            CFBundleURLSchemes: [mrlttechome]
        NSLocalNetworkUsageDescription: MrLTTec Home finds and controls the TVs, speakers and lights on the Wi-Fi you are connected to.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrlttec.smarthome
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: MrLTTec Mirror
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrlttec.smarthome.ScreenBroadcast
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
