# XcodeGen spec for MrLTTec Smart Home (iPhone 17 Pro, runs on iOS 26 and 27).
name: SmartHome
options:
  bundleIdPrefix: com.mrlttec
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SmartHome:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Web
        type: folder
        buildPhase: resources
    scheme: {}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MrLTTec Home
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: MrLTTec Home finds and controls the TVs, speakers and lights on the Wi-Fi you are connected to.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrlttec.smarthome
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
