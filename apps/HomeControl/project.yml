# XcodeGen spec for MrLTTec Control: Landon's own room (the mini PC's Smart Home Control server), over Tailscale.
# Target device: iPhone 17 Pro. Deployment target 26.0 so it runs on iOS 26 and 27.
name: HomeControl
options:
  bundleIdPrefix: com.mrlttec
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HomeControl:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: ../../shared
    scheme: {}
    dependencies:
      - target: HomeWidgets
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MrLTTec Control
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Light
        NSLocalNetworkUsageDescription: MrLTTec Control talks to the MrLTTec server on your home Wi-Fi.
        # Lock Screen / Dynamic Island now playing
        NSSupportsLiveActivities: true
        # mrlttec-control://brightness opens the brightness sliders (Control Center button)
        CFBundleURLTypes:
          - CFBundleURLName: com.mrlttec.homecontrol
            CFBundleURLSchemes: [mrlttec-control]
        # Plain http to the Tailscale address (100.x). Only NSAllowsArbitraryLoads: when NSAllowsLocalNetworking is
        # also set, iOS ignores NSAllowsArbitraryLoads, and 100.x isn't "local", so http to it gets blocked.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrlttec.homecontrol
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  # Widgets, the Lock Screen / Dynamic Island card and the Control Center buttons.
  HomeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: MrLTTec Control
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrlttec.homecontrol.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
