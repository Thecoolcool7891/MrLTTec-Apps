name: Build & publish apps

on:
  push:
    branches: [main]
    paths: ["apps/**", "scripts/**", "shared/**", "news/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      app:
        description: "App folder to build (leave blank for all)"
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decide which apps to build
        id: pick
        env:
          INPUT_APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_APP" ]; then
            APPS="$INPUT_APP"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            APPS=$(ls apps)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if echo "$CHANGED" | grep -qE '^(scripts|shared)/'; then
              APPS=$(ls apps)
            else
              APPS=$(echo "$CHANGED" | grep '^apps/' | cut -d/ -f2 | sort -u || true)
            fi
          fi
          echo "Building: $APPS"
          echo "apps=$(echo $APPS)" >> "$GITHUB_OUTPUT"

      - name: Build, release, update source
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ steps.pick.outputs.apps }}
        run: |
          for APP in $APPS; do
            [ -f "apps/$APP/app.json" ] || continue
            bash scripts/build_app.sh "$APP"
          done

      - name: Update source.json
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/updates/*.args)
          if [ ${#files[@]} -eq 0 ]; then echo "No apps built (news/source refresh only)"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in "${files[@]}"; do eval "python3 scripts/update_source.py $(cat "$f")"; done
            python3 news/apply_news.py
            git add source.json
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Update source.json"
            if git push -q origin HEAD:main; then echo "source.json updated"; exit 0; fi
            echo "Push raced with another build, retrying ($attempt)"; sleep 5
          done
          exit 1

      # raw.githubusercontent.com caches files for 5 minutes. Release downloads are not cached that way,
      # so the same source.json is also attached to a release named "source" for instant updates:
      # https://github.com/<owner>/<repo>/releases/download/source/source.json
      - name: Publish uncached source link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          git show origin/main:source.json > "$RUNNER_TEMP/source.json"
          if ! gh release view source >/dev/null 2>&1; then
            gh release create source --title "App source" --latest=false \
              --notes "Add this to your sideload app: https://github.com/$GITHUB_REPOSITORY/releases/download/source/source.json"
          fi
          gh release upload source "$RUNNER_TEMP/source.json" --clobber
          echo "Uploaded https://github.com/$GITHUB_REPOSITORY/releases/download/source/source.json"
